spring.application.name=server
# Hosts like Render choose the port through $PORT; locally it stays 8080.
server.port=${PORT:8080}
spotify.client-id=${SPOTIFY_CLIENT_ID:}
spotify.client-secret=${SPOTIFY_CLIENT_SECRET:}
# Spring does not read .env by itself; this loads it as properties (KEY=value) when it exists. Path is relative to the working dir (server/).
spring.config.import=optional:file:.env[.properties]
